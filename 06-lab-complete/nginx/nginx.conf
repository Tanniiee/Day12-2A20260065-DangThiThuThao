# Nginx load balancer — phân tán traffic cho các agent replicas.
#
# Docker Compose DNS: service name "agent" resolve ra IP của TẤT CẢ replicas
# → dùng resolver của Docker (127.0.0.11) + variable để re-resolve liên tục,
#   nhờ đó instance mới scale lên / instance chết đều được cập nhật.

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            set $upstream http://agent:8000;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Nếu 1 instance lỗi → thử instance khác (reliability)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
}
