# =============================================================================
# Full production stack — chạy local giống architecture trên cloud
#
#   Client → Nginx (load balancer) → Agent x3 → Redis (shared state)
#
# Chạy:   docker compose up --build --scale agent=3
# Test:   curl http://localhost/health
# =============================================================================

services:
  agent:
    build: .
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      AGENT_API_KEY: ${AGENT_API_KEY:-secret-key-123}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    # KHÔNG đặt container_name / ports cố định → mới scale được nhiều replicas

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data          # persist state qua restart
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent

volumes:
  redis-data:
