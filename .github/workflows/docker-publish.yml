# =============================================================================
# CI/CD — Build & push Docker image lên GitHub Container Registry (GHCR)
#
# LƯU Ý: file này phải nằm ở .github/workflows/ tại ROOT của repo.
# App nằm trong thư mục con 06-lab-complete/ → mọi path bên dưới trỏ vào đó.
#
# Trigger:
#   - push lên main          → build + push tag latest, sha, branch
#   - tag v* (vd: v1.0.0)    → build + push tag semver
#   - pull request           → chỉ build (không push) để verify
#
# Không cần secret nào thêm: dùng GITHUB_TOKEN có sẵn (permissions bên dưới).
# Image: ghcr.io/<owner>/<repo>:latest
# =============================================================================

name: Build & Push to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "06-lab-complete/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "06-lab-complete/**"
  workflow_dispatch: {}        # cho phép chạy tay từ tab Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # tanniiee/day12-2a20260065-dangthithuthao

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test trước khi build (fail fast — không push image lỗi)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest fakeredis httpx

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Job 2: Build & push image
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # cần để push lên GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sinh tags + labels chuẩn OCI tự động
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch              # main
            type=semver,pattern={{version}}    # v1.2.3 → 1.2.3
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-               # sha-abc1234
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./06-lab-complete           # app nằm trong thư mục con
          file: ./06-lab-complete/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layer giữa các lần build → CI nhanh hơn nhiều
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify image size < 500 MB (yêu cầu rubric Day 12)
      - name: Check image size
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker pull "$TAG"
          SIZE_MB=$(docker image inspect "$TAG" --format='{{.Size}}' | awk '{printf "%d", $1/1024/1024}')
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Image quá 500 MB (${SIZE_MB} MB) — vi phạm rubric Day 12"
            exit 1
          fi
